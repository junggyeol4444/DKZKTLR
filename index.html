<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AKASHIC RECORDS — Universal Information Archive">
<title>AKASHIC RECORDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Noto+Serif:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="lang-ko">

<div id="noise" aria-hidden="true"></div>

<!-- ============================================================
     언어 선택 (공용) — 비로그인 상태에서도 동작
     ============================================================ -->
<template id="tpl-langpicker">
  <div class="langpicker" role="group">
    <button type="button" class="lang-btn" data-lang="ko">KO</button><span aria-hidden="true">|</span>
    <button type="button" class="lang-btn" data-lang="en">EN</button><span aria-hidden="true">|</span>
    <button type="button" class="lang-btn" data-lang="ja">JA</button>
  </div>
</template>

<!-- ============================================================
     2.1 접근 경고 화면
     ============================================================ -->
<section id="screen-gate" class="screen gate" hidden>
  <div class="gate-lang" data-langpicker></div>
  <div class="gate-box">
    <p class="gate-warn blink" data-i18n="gate.warning"></p>
    <h1 class="gate-title" data-i18n="app.title"></h1>
    <p class="gate-sub" data-i18n="app.subtitle"></p>
    <p class="gate-line" data-i18n="gate.line1"></p>
    <p class="gate-line" data-i18n="gate.line2"></p>
    <p class="gate-level" data-i18n="gate.security"></p>
    <p class="gate-redact" aria-hidden="true">████████ ███ ████ ██████</p>
    <div class="gate-actions">
      <a class="btn btn-gold" href="#/login" data-i18n="gate.login"></a>
      <a class="btn btn-red"  href="#/signup" data-i18n="gate.register"></a>
    </div>
  </div>
</section>

<!-- 세션 확인 중 로딩 (깜빡임 방지) -->
<section id="screen-boot" class="screen gate">
  <div class="gate-box">
    <h1 class="gate-title" data-i18n="app.title"></h1>
    <p class="gate-line" data-i18n="gate.checking"></p>
    <div class="skeleton-bar"></div>
  </div>
</section>

<!-- ============================================================
     2.2 로그인
     ============================================================ -->
<section id="screen-login" class="screen gate" hidden>
  <div class="gate-lang" data-langpicker></div>
  <form class="panel" id="form-login" novalidate>
    <h2 class="panel-title" data-i18n="login.title"></h2>
    <div class="field">
      <label for="login-email" data-i18n="login.email"></label>
      <input id="login-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="login-pw" data-i18n="login.password"></label>
      <input id="login-pw" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>
    <div id="login-resend-wrap" hidden>
      <button type="button" class="btn btn-small" id="login-resend" data-i18n="login.resend"></button>
    </div>
    <div class="panel-actions">
      <button type="submit" class="btn btn-gold" data-i18n="login.submit"></button>
    </div>
    <div class="panel-links">
      <a href="#/reset"  data-i18n="login.reset"></a>
      <a href="#/signup" data-i18n="login.register"></a>
    </div>
  </form>
</section>

<!-- ============================================================
     2.3 회원가입
     ============================================================ -->
<section id="screen-signup" class="screen gate" hidden>
  <div class="gate-lang" data-langpicker></div>
  <form class="panel" id="form-signup" novalidate>
    <h2 class="panel-title" data-i18n="signup.title"></h2>
    <div class="field">
      <label for="su-email" data-i18n="signup.email"></label>
      <input id="su-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="su-pw" data-i18n="signup.password"></label>
      <input id="su-pw" name="password" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="su-pw2" data-i18n="signup.confirm"></label>
      <input id="su-pw2" name="confirm" type="password" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="su-name" data-i18n="signup.name"></label>
      <input id="su-name" name="displayName" type="text" maxlength="20" required>
    </div>
    <div class="field">
      <label for="su-lang" data-i18n="signup.lang"></label>
      <select id="su-lang" name="lang">
        <option value="ko">KO</option>
        <option value="en">EN</option>
        <option value="ja">JA</option>
      </select>
    </div>
    <div class="field field-check">
      <input id="su-agree" name="agree" type="checkbox">
      <label for="su-agree" data-i18n="signup.agree"></label>
    </div>
    <p class="form-error" id="signup-error" role="alert" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="submit" class="btn btn-gold" data-i18n="signup.submit"></button>
      <a href="#/" class="btn btn-red" data-i18n="signup.cancel"></a>
    </div>
  </form>
</section>

<section id="screen-signup-done" class="screen gate" hidden>
  <div class="panel">
    <h2 class="panel-title" data-i18n="signup.done.title"></h2>
    <p class="panel-text" data-i18n="signup.done.body"></p>
    <div class="panel-actions">
      <a href="#/login" class="btn btn-gold" data-i18n="signup.done.back"></a>
    </div>
  </div>
</section>

<!-- ============================================================
     2.4 비밀번호 재설정
     ============================================================ -->
<section id="screen-reset" class="screen gate" hidden>
  <div class="gate-lang" data-langpicker></div>
  <form class="panel" id="form-reset" novalidate>
    <h2 class="panel-title" data-i18n="reset.title"></h2>
    <p class="panel-text" data-i18n="reset.desc"></p>
    <div class="field">
      <label for="rs-email" data-i18n="login.email"></label>
      <input id="rs-email" name="email" type="email" autocomplete="email" required>
    </div>
    <p class="form-note" id="reset-note" role="status" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="submit" class="btn btn-gold" data-i18n="reset.submit"></button>
      <a href="#/login" class="btn btn-red" data-i18n="form.cancel"></a>
    </div>
  </form>
</section>

<section id="screen-reset-confirm" class="screen gate" hidden>
  <form class="panel" id="form-reset-confirm" novalidate>
    <h2 class="panel-title" data-i18n="reset.new.title"></h2>
    <p class="panel-text" data-i18n="reset.new.desc"></p>
    <div class="field">
      <label for="rc-pw" data-i18n="login.password"></label>
      <input id="rc-pw" name="password" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <p class="form-error" id="rc-error" role="alert" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="submit" class="btn btn-gold" data-i18n="reset.new.submit"></button>
    </div>
  </form>
</section>

<!-- ============================================================
     2.5 메인 레이아웃
     ============================================================ -->
<div id="app" hidden>
  <div class="topbar">
    <span class="tb-classified blink" data-i18n="top.classified"></span>
    <span class="tb-sep" aria-hidden="true">◆</span>
    <span class="tb-clear"><span data-i18n="top.clearance"></span>: <b id="tb-level">—</b></span>
    <span class="tb-sep" aria-hidden="true">◆</span>
    <span class="tb-keeper" id="tb-keeper">—</span>
    <span class="tb-spacer"></span>
    <span data-langpicker></span>
    <button type="button" class="btn btn-small" id="btn-logout" data-i18n="top.logout"></button>
  </div>

  <!-- 4.3 등급 상승 상단 배너 -->
  <div id="level-banner" class="level-banner" role="status" aria-live="polite" hidden>
    <span id="level-banner-text"></span>
    <button type="button" class="btn btn-small" id="level-banner-close"></button>
  </div>

  <header class="masthead">
    <h1 class="mast-title">◈ <span data-i18n="app.title"></span> ◈</h1>
    <p class="mast-sub" data-i18n="app.subtitle"></p>
  </header>

  <nav class="crumbbar" aria-label="breadcrumb">
    <span class="crumb-label" data-i18n="nav.location"></span>:
    <span id="crumbs"></span>
    <button type="button" id="btn-drawer" class="btn btn-icon" aria-expanded="false"
            aria-controls="drawer" title="MENU">☰</button>
  </nav>

  <div class="layout">
    <main id="main" tabindex="-1"></main>
    <aside id="sidebar-desktop" class="sidebar" aria-label="archive status"></aside>
  </div>

  <footer class="footer">
    <span class="blink" data-i18n="footer.warn"></span>
  </footer>
</div>

<!-- 2.17 햄버거 패널 -->
<div id="drawer-backdrop" hidden></div>
<div id="drawer" class="drawer" hidden aria-hidden="true">
  <button type="button" class="btn btn-icon drawer-close" id="drawer-close" title="CLOSE">✕</button>
  <div id="sidebar-drawer" class="sidebar"></div>
</div>

<!-- 2.10 상세 모달 -->
<div id="modal-record" class="modal" hidden role="dialog" aria-modal="true"
     aria-labelledby="modal-record-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box" role="document">
    <div class="modal-tools">
      <button type="button" class="btn btn-icon" id="modal-bookmark" title="BOOKMARK">☆</button>
      <div class="menu-wrap">
        <button type="button" class="btn btn-icon" id="modal-menu" aria-haspopup="true"
                aria-expanded="false" title="MENU">⋮</button>
        <ul class="menu" id="modal-menu-list" hidden></ul>
      </div>
      <button type="button" class="btn btn-icon" data-close title="CLOSE">✕</button>
    </div>
    <p class="modal-kicker" data-i18n="modal.title"></p>
    <h2 class="modal-title" id="modal-record-title"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-related" id="modal-related"></div>
  </div>
</div>

<!-- 2.14 신고 모달 -->
<div id="modal-report" class="modal" hidden role="dialog" aria-modal="true"
     aria-labelledby="modal-report-title">
  <div class="modal-backdrop" data-close></div>
  <form class="modal-box modal-small" id="form-report" role="document">
    <div class="modal-tools">
      <button type="button" class="btn btn-icon" data-close title="CLOSE">✕</button>
    </div>
    <h2 class="modal-title" id="modal-report-title" data-i18n="report.title"></h2>
    <div class="field">
      <label for="rp-reason" data-i18n="report.reason"></label>
      <select id="rp-reason" name="reason">
        <option value="false_info"    data-i18n="report.r.false_info"></option>
        <option value="no_source"     data-i18n="report.r.no_source"></option>
        <option value="fiction"       data-i18n="report.r.fiction"></option>
        <option value="inappropriate" data-i18n="report.r.inappropriate"></option>
        <option value="other"         data-i18n="report.r.other"></option>
      </select>
    </div>
    <div class="field">
      <label for="rp-detail" data-i18n="report.detail"></label>
      <textarea id="rp-detail" name="detail" rows="3" data-i18n-ph="report.detail.ph"></textarea>
    </div>
    <p class="form-error" id="rp-error" role="alert" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="submit" class="btn btn-red" data-i18n="report.submit"></button>
      <button type="button" class="btn" data-close data-i18n="form.cancel"></button>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="i18n.js"></script>
<script src="supabase.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
